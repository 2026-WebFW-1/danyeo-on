name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소해요
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      # React 프로젝트를 만들기 전에는 검사할 코드가 없어서 나머지 단계를 건너뛰어요
      - name: 프로젝트 확인
        id: project
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::package.json이 없어서 lint와 빌드를 건너뛰어요"
          fi

      # 버전은 package.json의 packageManager를 읽어요
      - name: pnpm 설치
        if: steps.project.outputs.exists == 'true'
        uses: pnpm/action-setup@v6

      - name: Node 설치
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 패키지 설치
        if: steps.project.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint 검사
        if: steps.project.outputs.exists == 'true'
        run: pnpm lint

      # 테스트가 실제 Chromium에서 돌아서 브라우저와 시스템 라이브러리를 같이 설치해요
      - name: 테스트용 브라우저 설치
        if: steps.project.outputs.exists == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # 테스트 파일이 아직 없는 브랜치에서도 통과하도록 --passWithNoTests를 붙여요
      - name: 테스트
        if: steps.project.outputs.exists == 'true'
        run: pnpm test --run --passWithNoTests

      - name: 빌드
        if: steps.project.outputs.exists == 'true'
        run: pnpm build
